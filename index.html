  };
  openSheet(sh);
}

function validate() {
  const c = day.cards[state.i];
  const p = [...state.picks].sort();
  const a = [...c.answer].sort();
  const ok = p.length === a.length && p.every((x, k) => x === a[k]);
  state.results[state.i] = { picks: p, ok };
  if (ok) state.aura += GAIN;
  render(false);
  if (ok) { setAura(true); confetti(); }
}

// Enregistre le jour une seule fois, à la fin de la 3e question.
function finishDay() {
  state.first = !alreadyPlayed();
  if (!state.first) return;
  const good = state.results.filter((r) => r.ok).length;
  profile.days[dayKey()] = { good, total: day.cards.length, aura: state.aura, date: dayKey(), on: iso(new Date()), oks: state.results.map((r) => r.ok) };
  // Paliers de série : bonus versé une seule fois par palier.
  state.milestone = null;
  if (dayKey() === iso(new Date())) {
    const n = currentStreak(); profile.milestones = profile.milestones || [];
    MILESTONES.forEach(([m, bonus]) => { if (n >= m && !profile.milestones.includes(m)) { profile.milestones.push(m); profile.mBonus = (profile.mBonus || 0) + bonus; state.milestone = { m, bonus }; } });
  }
  saveProfile();
  track(dayKey() === iso(new Date()) ? "partie-terminee" : "jour-rattrape");
}

const digOks = (t) => ((profile.dig[t.id] || {}).oks || []);
// Mises à jour de la semaine (23/11) : une question ajoutée porte « added » (date). Nouvelles pour un joueur = ajoutées et pas encore jouées, alors qu'il avait commencé le sujet.
const digNew = (t) => { const oks = digOks(t); return oks.length ? t.questions.slice(oks.length).filter((q) => q.added).length : 0; };
const digFresh = (t) => t.questions.some((q) => q.added && (Date.now() - new Date(q.added + "T00:00:00")) < 8 * 864e5);
// Sujet ajouté depuis moins de 8 jours et jamais ouvert par le joueur : étiquette « Nouveau sujet » (23/11).
const digNewTheme = (t) => !digOks(t).length && t.added && (Date.now() - new Date(t.added + "T00:00:00")) < 8 * 864e5;
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
const digDone = (t) => digOks(t).length >= t.questions.length;
const BOOK_ICO = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5Z M12 6v13"/></svg>';
const digLinks = (t) => { const seen = new Set(); return t.questions.map((q) => q.link).filter((l) => !seen.has(l.url) && seen.add(l.url)); };
function digOpen(t) { dig.id = t.id; dig.step = "home"; render(); }

    const nNew = digNew(t);
    const meta = done ? `Maîtrise : ${Math.round((good / total) * 100)} %`
      : digNewTheme(t) ? `<span class="dig-new soft">Nouveau</span><span class="nw">Jusqu'à ${(total * DIG_GAIN + DIG_PERFECT).toLocaleString("fr-FR").replace(/\u202f/g, "\u00a0")} aura</span>`
      : nNew ? `<span class="dig-new">${plural(nNew, "nouvelle question").replace("nouvelle questions", "nouvelles questions")}</span>`
      : oks.length ? `<span class="dig-bar"><i style="width:${Math.round((oks.length / total) * 100)}%"></i></span>${oks.length}/${total}`
      : `<span class="nw">Jusqu'à ${(total * DIG_GAIN + DIG_PERFECT).toLocaleString("fr-FR").replace(/\u202f/g, "\u00a0")} aura</span>`;
    const b = $(`<button type="button" class="dig-tile${done ? " done" : ""}">
      <span class="dig-num k-${t.color}">${done ? "✓" : DIG_ICO}</span>
      <span class="dig-body">
        <span class="dig-name">${esc(t.name)}</span>
        <span class="dig-pitch">${esc(t.pitch)}</span>
        <span class="dig-meta">${meta}${!done && !jokersFull() && ((profile.dig[t.id] || {}).jokerAt || 0) < total ? '<span class="dig-jk">+1 joker</span>' : ""}${(profile.jokerFrom || []).includes(t.id) ? '<span class="dig-jk won">Joker gagné</span>' : ""}</span>
      </span>
      <span class="dig-go" aria-hidden="true">›</span>
    </button>`);
    b.onclick = () => digOpen(t);
    el.appendChild(b);
  });
  const nThemes = CREUSER.filter((t) => digNew(t)).length;

  return el;
}
function digQuestionView() {
  const t = digTheme(), i = digOks(t).length, c = t.questions[i];
  const el = $(`<section class="q">
    <span class="theme-pill k-${t.color}">${esc(t.tag)}</span>
    <p class="q-hook">${esc(c.hook)}</p>
    <h2 class="q-text">${esc(c.question)}</h2>
    <span class="q-chip">${chipOf(c)}</span>
  </section>`);
  const box = answersBox(c, null, false);
  el.appendChild(box);
  let picks = [];
  const answer = () => {
    const p = [...picks].sort(), a = [...c.answer].sort();
    const ok = p.length === a.length && p.every((x, k) => x === a[k]);
    box.replaceWith(answersBox(c, { picks: p, ok }, false));
    if (ok && !t.serious) confetti();
    digVerdict(t, c, ok, i);
  };
  box.querySelectorAll(".ans").forEach((b) => {
    const key = b.dataset.key;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      if (c.type === "multi") {
        picks = picks.includes(key) ? picks.filter((x) => x !== key) : [...picks, key];
        b.classList.toggle("picked", picks.includes(key));
        b.setAttribute("aria-pressed", picks.includes(key) ? "true" : "false");
        if (picks.length === c.answer.length) { box.querySelectorAll(".ans").forEach((x) => (x.disabled = true)); setTimeout(answer, 350); }
      } else { picks = [key]; answer(); }
    };
  });
  return el;
}
function digVerdict(t, c, ok, i) {
  const rec = profile.dig[t.id] || { oks: [] };
  rec.oks = digOks(t).slice(0, i).concat(ok);
  rec.paid = rec.paid || {}; rec.aura = rec.aura || 0;
  let gain = 0, gotJoker = false, perfect = false;
  if (ok && !rec.paid[i]) { rec.paid[i] = 1; rec.aura += DIG_GAIN; gain = DIG_GAIN; }
  const last = i === t.questions.length - 1;
  if (last) {
    track("creuser-termine", t.id);
    if ((rec.jokerAt || 0) < t.questions.length) { rec.jokerAt = t.questions.length; gotJoker = grantJoker(t.id) ? "now" : "full"; if (gotJoker === "now") rec.joker = 1; }
    if (rec.oks.every(Boolean) && !rec.perfect) { rec.perfect = 1; rec.aura += DIG_PERFECT; perfect = true; }
  }
  profile.dig[t.id] = rec; saveProfile();
  dig.reward = last ? { gotJoker, perfect } : null;
  if (gain) setAura(true);
  const word = t.serious ? (ok ? "Exact." : "Pas tout à fait.") : ok ? "Bien vu !" : "Raté !";
  const sh = $(`<div class="sheet ${ok ? "ok" : "ko"}" role="status">
    <p class="sheet-verdict"><span class="sv-ico" aria-hidden="true">${ok ? "✓" : "✕"}</span>${word}<span class="sv-gain">${gain ? "+" + gain + " aura · " : ""}${i + 1}/${t.questions.length}</span></p>
    ${!ok && c.type !== "tf" ? goodLine(c) : ""}<p class="sheet-text">${esc(c.correction)}</p>
    <a class="sheet-link" href="${esc(c.link.url)}" target="_blank" rel="noopener"><span>Pour aller plus loin</span><b>${esc(c.link.label)}</b><small>${esc(c.link.note)}</small></a>
    <button class="btn" type="button">${last ? "Voir mon score" : "Question suivante"}</button>
  </div>`);
  sh.querySelector(".btn").onclick = () => { if (last) dig.step = "end"; render(); };
  openSheet(sh);
  setProgress();
}
function digEndView() {
  const t = digTheme(), oks = digOks(t), total = t.questions.length, good = oks.filter(Boolean).length;
  const title = good === total ? "Sujet maîtrisé." : good >= total / 2 ? "Bien creusé." : "Tu en sais plus qu'hier.";
  const next = CREUSER.find((x) => x.id !== t.id && !digDone(x));
  const rec0 = profile.dig[t.id] || {}, fmtN = (n) => n.toLocaleString("fr-FR").replace(/\u202f/g, "\u00a0");
  const el = $(`<section class="recap-page">
    <button type="button" class="dig-close" aria-label="Fermer et revenir aux sujets">✕</button>
    <div class="dig-score">
      <div class="big-ico" style="background:var(--${t.color})">${DIG_ICO}</div>
      <p class="mega">+${fmtN(rec0.aura || 0)}</p>
      <p class="score-unit">points d'aura</p>
      <span class="score-chip">${good}/${total} bonnes réponses</span>
      <h1 class="page-title">${title}</h1>
      ${rec0.perfect ? `<p class="milestone">Dont <b>${fmtN(DIG_PERFECT)} aura</b> de bonus : sujet maîtrisé à 100 %.</p>` : ""}
      ${dig.reward && dig.reward.gotJoker === "now" ? `<p class="milestone joker">Tu gagnes <b>1 joker</b>. Il protégera ta série si tu rates un jour.</p>` : ""}
      ${dig.reward && dig.reward.gotJoker === "full" ? `<p class="milestone joker">Tes 2 jokers sont déjà prêts : pas de joker en plus.</p>` : ""}
      <button type="button" class="link-btn" id="again">Recommencer ce sujet</button>
    </div>
    <h2 class="page-title" style="font-size:19px">Tes réponses</h2>
  </section>`);
  t.questions.forEach((c, k) => {
    const ok = oks[k];
    const keys = keysOf(c);
    const good = c.answer.map((key) => labelOf(c, key, keys.indexOf(key))).join(" ; ");
    el.appendChild($(`<article class="rc ${ok ? "ok" : "ko"}">
      <p class="rc-num"><span class="sv-ico" aria-hidden="true">${ok ? "✓" : "✕"}</span>Question ${k + 1}${ok ? "" : '<span class="rc-miss">Raté</span>'}</p>
      <p class="rc-q">${esc(c.question)}</p>
      <div class="rc-a good"><span>${c.answer.length > 1 ? "Bonnes réponses" : "Bonne réponse"}</span>${c.answer.length > 1 ? goodHtml(c) : esc(good)}</div>
      <details class="rc-more"><summary>Revoir l'explication</summary><p class="sheet-text">${esc(c.correction)}</p></details>
      <a class="sheet-link compact" href="${esc(c.link.url)}" target="_blank" rel="noopener"><span>Pour aller plus loin</span><b>${esc(c.link.label)}</b></a>
    </article>`));
  });
  if (good === total && !t.serious) setTimeout(confetti, 200);
  el.querySelector(".dig-close").onclick = () => { dig.step = "list"; dig.reward = null; render(); };
  el.querySelector("#again").onclick = () => { const r = profile.dig[t.id] || {}; profile.dig[t.id] = { oks: [], paid: r.paid, aura: r.aura, joker: r.joker, jokerAt: r.jokerAt, perfect: r.perfect }; dig.reward = null; saveProfile(); dig.step = "q"; render(); };
  const b = $(`<button class="btn" type="button">${next ? "Sujet suivant : " + esc(next.tag) : "Tous les sujets"}</button>`);
  b.onclick = () => { if (next) digOpen(next); else { dig.step = "list"; render(); } };
  setCta(b);
  return el;
}

document.getElementById("auraPill").onclick = showRules; document.getElementById("auraPill").style.cursor = "pointer";
document.querySelectorAll(".tab").forEach((b) => { b.onclick = () => { tab = b.dataset.tab; auraSub = null; pastFrom = null; if (tab === "dig") dig.step = "list"; render(); }; });
document.getElementById("quit").onclick = () => { closeSheet(); if (tab === "dig") { dig.step = "home"; render(); } else reset(); };
// Un seul bouton : « Jouer le [jour] » lance directement les questions, sans repasser par l'accueil (23/11).
let pendingStart = null;
window.addEventListener("hashchange", () => {
  tab = "play"; reset();
  if (pendingStart && pendingStart === dayKey()) { pendingStart = null; track("partie-commencee"); state.name = profile.name || ""; state.step = "q"; state.i = 0; state.picks = []; render(); }
});
// Écran d'ouverture : 1,2 seconde, puis il s'efface. Un toucher le ferme tout de suite.
(() => {
  const sp = document.getElementById("splash");
  const hide = () => { sp.classList.add("out"); setTimeout(() => sp.remove(), 450); };
  sp.addEventListener("click", hide);
  setTimeout(hide, 1200);
})();
applyJokers();
reset();
// Premier lancement (23/11) : « Comment ça marche », une seule fois, après l'écran d'ouverture.
if (!profile.seenIntro) setTimeout(() => {
  const ov = $(`<div class="howto" role="dialog" aria-label="Comment ça marche">
    <div class="howto-box">
      <p class="eyebrow"><b>Bienvenue sur Aura</b></p>
      <h1 class="hook">Comment ça marche</h1>
      <div class="howto-row"><span class="rule-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 4.6 2.4 6.9 7 7.6v.8c-4.6.7-6.4 3-7 7.6h-.8c-.6-4.6-2.4-6.9-7-7.6v-.8c4.6-.7 6.4-3 7-7.6Z"/></svg></span><p><b>3 questions par jour</b> sur l'actu. Chaque bonne réponse rapporte de l'aura.</p></div>
      <div class="howto-row"><span class="rule-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.1 2.6 2.3 2.8-.6-2.6-.2-5.4.5-8Z"/></svg></span><p><b>Joue chaque jour</b> pour allonger ta série.</p></div>
      <div class="howto-row"><span class="rule-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></span><p><b>Creuse un sujet</b> pour gagner plus d'aura et des jokers.</p></div>
      <button class="btn btn-play" type="button"><span class="play-ico" aria-hidden="true">▶</span>C'est parti</button>
    </div>
  </div>`);
  ov.querySelector(".btn").onclick = () => { profile.seenIntro = 1; saveProfile(); ov.remove(); };
  document.body.appendChild(ov);
}, 1300);
</script>
