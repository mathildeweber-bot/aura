<style>
/* Layout : écran de téléphone sur fond blanc, une carte à la fois, onglets en bas.
   Charte : blanc et noir, rose pour tout ce qui est commun à Aura (accueil, calendrier, fin, onglets). Une couleur par type de carte : jaune actualité, menthe tendance, lilas sujet de fond. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --tile: #f3f2f4;
  --ink: #111111;
  --muted: #6b6a70;
  --line: #e6e5ea;
  --pill: #111111;
  --on-pill: #ffffff;
  --jaune: #ffdf6e;
  --rose: #f7c1d9;
  --lilas: #cdbfff;
  --menthe: #bfe9d2;
  --on-pastel: #111111;
  --acc: #5b45c9;
  --good: #1f8a5b;
  --good-soft: #e1f4ea;
  --bad: #c2453a;
  --bad-soft: #fbe6e3;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --surface: #18181b; --tile: #222226; --ink: #f4f4f5; --muted: #a1a0a8; --line: #2c2c31;
    --pill: #f4f4f5; --on-pill: #111111; --acc: #b9a9ff;
    --good: #4cc690; --good-soft: #143326; --bad: #f0857a; --bad-soft: #3a1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --surface: #18181b; --tile: #222226; --ink: #f4f4f5; --muted: #a1a0a8; --line: #2c2c31;
  --pill: #f4f4f5; --on-pill: #111111; --acc: #b9a9ff;
  --good: #4cc690; --good-soft: #143326; --bad: #f0857a; --bad-soft: #3a1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-size: 26px; letter-spacing: 0.01em; line-height: 1; text-transform: uppercase; }
.brand small { display: block; font-family: var(--label); font-weight: 600; font-size: 13px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 4px; }
.aura-pill { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; background: var(--pill); color: var(--on-pill); border-radius: 999px; padding: 7px 13px; white-space: nowrap; }
.aura-pill::before { content: "✦"; margin-right: 6px; }
.aura-pill.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }
.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--ink); }
.progress span.now { background: var(--rose); }
.card { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); }
.head { border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--lilas); color: var(--on-pastel); }
.k-jaune { background: var(--jaune); } .k-menthe { background: var(--menthe); } .k-lilas { background: var(--lilas); } .k-rose { background: var(--rose); }
.eyebrow { font-family: var(--label); font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: inherit; opacity: 1; display: flex; gap: 8px; flex-wrap: wrap; margin: 0; }
.card > .eyebrow { color: var(--muted); }
.eyebrow b { font-weight: 700; }
.hook { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.05; text-transform: uppercase; text-wrap: balance; margin: 0; }
.question { margin: 0; font-size: 16px; font-weight: 500; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.options { display: flex; flex-direction: column; gap: 10px; }
.options.tf { flex-direction: row; }
.options.tf .opt { flex: 1; justify-content: center; font-family: var(--label); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 999px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 22px;
  padding: 12px 16px; cursor: pointer; transition: background .15s, color .15s;
}
.opt:hover:not(:disabled) { background: var(--tile); }
.opt:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible, .cal-day:focus-visible, .cal-nav:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.opt .k { font-family: var(--label); font-weight: 700; font-size: 17px; min-width: 1em; }
.opt.picked { background: var(--ink); color: var(--bg); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--ink); }
.opt.right .k { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.opt.wrong .k { color: var(--bad); }
.opt:disabled { cursor: default; }
.multi-hint { margin: 0; font-size: 15px; line-height: 1.4; border: 2px dashed var(--ink); border-radius: 16px; padding: 10px 14px; }
.opt.multi { align-items: center; }
.opt .box { flex: none; width: 22px; height: 22px; border: 2px solid currentColor; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; line-height: 1; }
.opt.ticked .box::after { content: "✓"; }
.opt.multi.ticked:not(:disabled) { border-width: 2.5px; background: var(--tile); }
.btn { font: inherit; font-weight: 600; font-size: 16px; border-radius: 999px; padding: 14px 18px; cursor: pointer; border: 0; background: var(--pill); color: var(--on-pill); width: 100%; text-align: center; }
.btn:disabled { opacity: .35; cursor: default; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.link-btn { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.verdict { scroll-margin-top: 12px; border-radius: 999px; padding: 11px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.ko { background: var(--bad-soft); color: var(--bad); }
.verdict .gain { font-variant-numeric: tabular-nums; white-space: nowrap; }
.correction { margin: 0; }
.more { display: flex; flex-direction: column; gap: 4px; background: var(--tile); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.more .lbl, .mine .lbl { font-family: var(--label); font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.more a { color: var(--acc); font-weight: 600; text-decoration: none; }
.more a::after { content: " ›"; }
.more a.btn { color: var(--on-pill); display: block; }
.more a.btn::after { content: ""; }
.more a.btn.ghost { color: var(--ink); }
.more .note { color: var(--muted); }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
input[type=text], textarea { font: inherit; color: var(--ink); background: var(--tile); border: 1.5px solid transparent; border-radius: 999px; padding: 12px 16px; width: 100%; }
.intro p { margin: 0; }
.intro .head, .end-head { background: var(--rose); }
.welcome { font-family: var(--display); font-size: 22px; text-transform: uppercase; margin: 0; }
.big { font-family: var(--display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; margin: 0; }
.big span { font-size: 22px; text-transform: uppercase; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.recap li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line); }
.dot.ok { background: var(--good); } .dot.ko { background: var(--bad); }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.mine { display: flex; flex-direction: column; gap: 8px; background: var(--tile); border-radius: 18px; padding: 14px 16px; }
.week { display: flex; justify-content: space-between; gap: 4px; }
.wk-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--ink); }
.wk-dow { font-family: var(--label); font-weight: 700; font-size: 13px; color: var(--muted); }
.wk-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; border: 2px solid var(--ink); }
.wk-day.done .wk-dot { background: var(--rose); border-color: var(--rose); color: var(--on-pastel); }
.wk-day.none .wk-dot { border-color: var(--line); color: var(--muted); font-weight: 500; }
.wk-day.today .wk-dow { color: var(--ink); }
.wk-day.cur .wk-dot { box-shadow: 0 0 0 3px var(--tile), 0 0 0 5px var(--ink); }
.mine-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mine-total { font-family: var(--display); font-size: 28px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.mine-total span { font-size: 16px; text-transform: uppercase; }
.day-pick { display: flex; flex-direction: column; gap: 8px; }
.day-pick .lbl { font-family: var(--label); font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--label); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); text-decoration: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; }
.chip { flex: 1; text-align: center; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.done { background: var(--rose); border-color: var(--rose); color: var(--on-pastel); }
.small-btn { width: auto; padding: 9px 16px; font-size: 14px; }
.halo { background: radial-gradient(130% 110% at 100% 0%, var(--rose) 0%, var(--rose) 35%, #fbe3ee 65%, var(--surface) 95%); border: 0; color: var(--on-pastel); }
.halo .eyebrow, .halo .question { color: var(--on-pastel); }
.aura-page { display: flex; flex-direction: column; gap: 16px; }
.sec-title { font-weight: 700; font-size: 19px; margin: 4px 2px 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-title { font-family: var(--label); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
.cal-nav { font: inherit; font-size: 22px; line-height: 1; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.cal-dow { font-family: var(--label); font-size: 13px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
.cal-day { font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; background: transparent; color: var(--muted); }
.cal-day.today { color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--line); }
.cal-day.done { background: var(--rose); color: var(--on-pastel); font-weight: 700; cursor: pointer; }
.cal-day.sel { background: var(--pill); color: var(--on-pill); }
.cal-day:disabled { cursor: default; }
.day-sum.sel { border-color: var(--ink); }
.day-score { margin: -6px 0 0; font-size: 15px; font-weight: 600; }
.sum-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sum-list li { display: flex; gap: 10px; align-items: flex-start; background: var(--tile); border-radius: 16px; padding: 12px; }
.sum-list .dot { margin-top: 6px; }
.sum-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 14px; }
.sum-theme { align-self: flex-start; font-family: var(--label); font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--on-pastel); border-radius: 999px; padding: 2px 10px; }
.sum-q { font-size: 15px; font-weight: 500; }
.sum-body a { color: var(--acc); font-weight: 600; text-decoration: none; }
.sum-body a::after { content: " ›"; }
.sum-body .note { color: var(--muted); font-size: 13px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tab { flex: 0 1 180px; font: inherit; font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 10px 12px; cursor: pointer; }
.tab::before { display: block; font-family: var(--body); font-size: 18px; line-height: 1; margin-bottom: 2px; }
#tabPlay::before { content: "▶"; font-size: 14px; } #tabAura::before { content: "✦"; }
.tab.on { color: var(--on-pastel); background: var(--rose); }
.streak-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; font-size: 14px; font-weight: 500; }
.streak-pill.joker { background: #8ab4f8; color: #111111; }
.mine-head > span:first-child { flex: 1; white-space: nowrap; }
.mine-head .flame { white-space: nowrap; font-size: 13px; padding: 3px 9px; }
.mine-head { gap: 6px; }
.flame.joker-pill { background: #dbe8fd; color: #111111; }
.streak-pill { flex: none; font-family: var(--label); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--pill); color: var(--on-pill); border-radius: 999px; padding: 5px 11px; font-variant-numeric: tabular-nums; }
.celebrate { position: fixed; inset: 0; z-index: 50; background: var(--rose); color: var(--on-pastel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px; text-align: center; cursor: pointer; animation: celIn .25s ease both; }
.celebrate.out { animation: celOut .25s ease both; }
.cel-halo { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 72px; line-height: 1; background: radial-gradient(circle, #fff 0%, #fde7f0 45%, rgba(255,255,255,0) 72%); animation: celGrow .9s cubic-bezier(.2,1.4,.4,1) both; margin-bottom: 8px; }
.cel-title { font-family: var(--display); font-size: 40px; line-height: 1; text-transform: uppercase; margin: 0; animation: celUp .5s .35s ease both; }
.cel-sub { font-family: var(--label); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; animation: celUp .5s .55s ease both; }
.cel-sub b { font-family: var(--display); font-size: 30px; }
.cel-note { font-size: 15px; margin: 0; animation: celUp .5s .75s ease both; }
.cel-tap { position: absolute; bottom: 32px; font-size: 13px; opacity: .6; margin: 0; }
@keyframes celIn { from { opacity: 0; } }
@keyframes celOut { to { opacity: 0; } }
@keyframes celGrow { 0% { transform: scale(.2) rotate(-40deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes celUp { from { transform: translateY(14px); opacity: 0; } }
.wk-day.done.late .wk-dot, .cal-day.done.late { background: #fdeef5; border: 2px dashed #d97fa8; color: #111111; }
/* Semaine lisible (23/11) : fait = rose plein + coche, à faire = rond vide, jour affiché = trait dessous */
.wk-dot { position: relative; }
.wk-day.done .wk-dot { font-size: 17px; }
.wk-num { font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
/* Couleurs classiques (23/11, demande de Mathilde) : vert = fait le jour même, orange = rattrapé, rouge = à faire */
:root { --day-ok: #34b36b; --day-late: #f5a33b; --day-todo: #e5484d; }
.wk-day.done .wk-dot { background: var(--day-ok); border-color: var(--day-ok); color: #ffffff; }
.wk-day.done.late .wk-dot { background: var(--day-late); border: 2px solid var(--day-late); color: #111111; }
.wk-day.open .wk-dot { border-color: var(--day-todo); }
.wk-day.cur .wk-dot { box-shadow: none; }
.wk-day::after { content: ""; width: 18px; height: 3px; border-radius: 2px; background: transparent; }
.wk-day.cur::after { background: var(--ink); }
.wk-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.wk-legend span { display: inline-flex; align-items: center; gap: 5px; }
.wk-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; }
.wk-legend .k-done { background: var(--day-ok); }
.wk-legend .k-late { background: var(--day-late); }
.wk-legend .k-todo { border: 2px solid var(--day-todo); }
.wk-legend .k-cur { width: 12px; height: 3px; border-radius: 2px; background: var(--ink); }
/* Calendrier, mêmes couleurs que la semaine (23/11) : rose = fait, lilas = rattrapé, contour = à faire, anneau noir = jour affiché */
.wk-day.done.late .wk-dot { border-style: solid; }
.cal-day.done { background: var(--day-ok); color: #ffffff; }
.cal-day.done.late { background: var(--day-late); border: 0; color: #111111; }
.cal-day.open { border: 2px solid var(--day-todo); color: var(--ink); font-weight: 700; cursor: pointer; }
.cal-day.sel, .cal-day.done.sel, .cal-day.done.late.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.cal-day.done.sel { background: var(--day-ok); color: #ffffff; } .cal-day.done.late.sel { background: var(--day-late); color: #111111; }
.late-key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #fdeef5; border: 1.5px dashed #d97fa8; margin-right: 6px; vertical-align: -1px; }
.end-total { margin: 0; padding-top: 10px; border-top: 1.5px solid rgba(17,17,17,.2); font-size: 15px; }
.end-total b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.name-tag { align-self: flex-start; font-family: var(--label); font-weight: 700; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--pill); color: var(--on-pill); border-radius: 999px; padding: 4px 14px; }
/* ---- Refonte 18/11 : barre d'onglets flottante, quiz plein écran, panneau de verdict ---- */
body { font-size: 15px; padding-block: 12px calc(150px + env(safe-area-inset-bottom, 0px)); }
.wrap { gap: 12px; }
.brand { font-size: 22px; color: #e0457b; }
.card { padding: 14px; gap: 12px; border-radius: 20px; }
.head { padding: 14px; gap: 6px; border-radius: 16px; }
.intro .hook { font-size: 20px; }
.intro .head .question { font-size: 15px; }
.mine { padding: 10px 12px; gap: 6px; }
.wk-dot { width: 32px; height: 32px; font-size: 13px; }
.chip { font-size: 15px; padding: 5px 10px; }
.btn { padding: 13px 18px; }
/* Bouton pour jouer, en couleur pour qu'on comprenne qu'on peut jouer (23/11) */
.btn.btn-play { background: #e0457b; color: #ffffff; font-weight: 700; box-shadow: 0 6px 18px rgba(224, 69, 123, .35); }
.btn.btn-play:active { transform: scale(.98); }
.play-ico { font-size: 13px; margin-right: 8px; vertical-align: 1px; }
.tabs { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(calc(100vw - 32px), 340px);
  padding: 5px; gap: 4px; border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 28px rgba(0,0,0,.12); background: var(--surface); }
.tab { flex: 1; font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: 0; text-transform: none; padding: 6px 8px; color: var(--muted); }

semble samedi 21 novembre à Paris ?", "type": "multi", "options": ["Les syndicats de salariés.", "Les organisations de lycéens et d'étudiants.", "Le Medef.", "Les gilets jaunes et l'association Droit au logement."], "answer": ["A", "B", "D"], "correction": "La CGT, la CFDT, FO, la FSU et Solidaires défileront avec les syndicats lycéens et étudiants. Les gilets jaunes et Droit au logement se joindront au cortège. Le Medef, lui, n'en est pas.", "link": {"label": "Libération, 19 novembre 2026", "url": "https://www.liberation.fr/economie/social/paris-syndicats-gilets-jaunes-et-defenseurs-du-droit-au-logement-manifesteront-ensemble-samedi-20261119_BO23RA3HRRG2LA345E6VOMV6AE/", "note": "Article réservé aux abonnés."}}, {"hook": "Les cours ratés, eux, ne se rattrapent pas en manif.", "question": "Selon un sondage pour Le Figaro, que pensent la plupart des Français des blocages de lycées et d'universités ?", "type": "one", "options": ["Qu'ils n'auront aucun effet sur les élèves.", "Qu'ils vont pénaliser les élèves pour la suite.", "Qu'il faut avancer les vacances de Noël.", "Qu'ils vont faire baisser les prix."], "answer": ["B"], "correction": "85 % des Français pensent que les blocages vont pénaliser les élèves dans leurs études et leur métier. Près de la moitié reprochent au gouvernement son laxisme. Le mouvement dure depuis plus d'un mois.", "link": {"label": "Le Figaro, 19 novembre 2026", "url": "https://www.lefigaro.fr/actualite-france/colere-des-lyceens-et-etudiants-pres-de-la-moitie-des-francais-pointe-du-doigt-le-laxisme-du-gouvernement-20261119", "note": "Sondage Odoxa-Backbone Consulting. Article réservé aux abonnés."}}, {"hook": "Pas de voiture, pas de travail. Une voiture, plus de budget.", "question": "Selon une étude, 7 millions de personnes en France sont « prises en étau » par leur voiture. Pourquoi ?", "type": "one", "options": ["Elles en ont besoin, mais elle leur coûte de plus en plus cher.", "Elles ne trouvent plus de garagiste près de chez elles.", "Le prix des voitures neuves a doublé en 1 an.", "Les péages ont triplé depuis la guerre."], "answer": ["A"], "correction": "La voiture pèse 13 % du budget des ménages qui gagnent 1 000 à 2 000 € par mois, contre 3,5 % au-dessus de 5 000 €. Les carburants restent chers.", "link": {"label": "Le Monde, 23 novembre 2026", "url": "https://www.lemonde.fr/economie/article/2026/11/23/voiture-sept-millions-de-personnes-en-france-prises-en-etau-entre-necessite-et-cout-pointe-une-etude_6814273_3234.html", "note": "Étude de l'Institut Terram. Article réservé aux abonnés."}, "added": "2026-11-23"}]}, {"id": "monde", "title": "Le monde se redessine : Trump, Xi, Poutine et l'Europe", "tag": "Géopolitique", "name": "Le monde se redessine", "pitch": "Qui pèse quoi, et où est l'Europe.", "color": "lilas", "serious": false, "added": "2026-11-18", "questions": [{"hook": "Un sommet, c'est aussi une vitrine.", "question": "Xi Jinping reçoit Donald Trump et Vladimir Poutine à Shenzhen, et non à Pékin. Pourquoi ce choix ?", "type": "one", "options": ["Pour montrer la puissance technologique de la Chine.", "Pour éviter les manifestations à Pékin.", "Parce que c'est la ville natale de Xi Jinping.", "Pour être tout près de Taïwan."], "answer": ["A"], "correction": "Shenzhen, petit village de pêcheurs il y a 50 ans, est devenue la Silicon Valley chinoise, capitale de l'IA et des robots. Xi y montre que la Chine peut rivaliser avec l'Amérique. Le message s'adresse aussi au reste du monde.", "link": {"label": "Courrier international, 18 novembre 2026", "url": "https://www.courrierinternational.com/article/geopolitique-trump-et-poutine-a-shenzen-la-ville-miracle-vitrine-de-la-prosperite-chinoise_288440", "note": "« Trump et Poutine à Shenzhen, la ville miracle »."}}, {"hook": "Ni soldats au front, ni simples touristes.", "question": "On a appris cette semaine que des militaires français sont présents en Ukraine. Que font-ils ?", "type": "one", "options": ["Ils forment des soldats et entretiennent du matériel, sans combattre.", "Ils combattent sur la ligne de front.", "Ils protègent la centrale nucléaire de Zaporijia.", "Ils pilotent des Rafale pour l'armée ukrainienne."], "answer": ["A"], "correction": "La mission « Volia » forme et entretient du matériel, depuis l'été au moins. Moscou y voit une « participation directe » à la guerre. Paris répond que la France n'est pas en guerre contre la Russie.", "link": {"label": "C dans l'air, 17 novembre 2026", "url": "https://octopus.saooti.com/main/pub/podcast/3030127", "note": "« Soldats français en Ukraine : l'avertissement de Moscou ». Gratuit."}}, {"hook": "On parle de nous, mais sans nous.", "question": "Les négociations de paix pour l'Ukraine, à Abou Dhabi, réunissent Russes, Ukrainiens et Américains, mais pas les Européens.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Moscou préfère traiter directement avec Washington. La France, l'Allemagne et le Royaume-Uni tentent de peser de l'extérieur. Or la paix en Ukraine décidera aussi de la sécurité de toute l'Europe.", "link": {"label": "C dans l'air, 11 novembre 2026", "url": "https://octopus.saooti.com/main/pub/podcast/2974981", "note": "« Guerre en Ukraine : la paix sans l'Europe ? ». Gratuit."}}, {"hook": "Trump a perdu une manche. Et pas la plus petite.", "question": "Aux élections de mi-mandat de novembre, qui a gagné aux États-Unis ?", "type": "one", "options": ["Les démocrates, qui reprennent le Congrès.", "Les républicains, qui renforcent leur majorité.", "Les républicains gardent le Sénat et la Chambre.", "Égalité : chaque parti garde une chambre."], "answer": ["A"], "correction": "Les démocrates ont repris le Sénat et la Chambre des représentants. Hakeem Jeffries va devenir le premier président noir de la Chambre. Pour ses 2 dernières années, Donald Trump devra composer avec un Congrès hostile.", "link": {"label": "France 24, 18 novembre 2026", "url": "https://www.france24.com/fr/am%C3%A9riques/20261118-apr%C3%A8s-les-midterms-hakeem-jeffries-choisi-par-les-d%C3%A9mocrates-pour-devenir-speaker-de-la-chambre", "note": "Gratuit."}}, {"hook": "Une liaison, une espionne, des puces. Ce n'est pas un film.", "question": "Pourquoi les puces de Nvidia sont-elles au cœur de la rivalité entre les États-Unis et la Chine ?", "type": "one", "options": ["Elles font tourner l'intelligence artificielle, et Washington interdit d'en vendre les meilleures à la Chine.", "Elles servent surtout aux consoles de jeux vendues en Chine.", "La Chine détient le brevet de leur invention.", "Elles contiennent du lithium que seule la Chine produit."], "answer": ["A"], "correction": "Nvidia conçoit les meilleures puces pour l'IA. Son patron a quitté la direction le 12 novembre. Il a reconnu une liaison avec une femme soupçonnée d'espionner pour Pékin, qui aurait récupéré des puces interdites d'export.", "link": {"label": "L'édito éco, France Inter, 10 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/l-edito-eco/l-edito-eco-du-mardi-10-novembre-2026-4748855", "note": "« Nvidia, l'espion qui l'aimait ». Gratuit."}}, {"hook": "Quand les grands jouent seuls, les petits font équipe.", "question": "Selon The Economist, que vont faire les pays moyens face aux grandes puissances qui démolissent les règles du jeu mondial ?", "type": "one", "options": ["S'allier entre eux.", "Choisir chacun un grand protecteur.", "Se fermer au commerce mondial.", "Rejoindre en masse les BRICS."], "answer": ["A"], "correction": "Le journal prévoit que les pays moyens vont s'allier entre eux pour peser. Il prévient : préserver des règles valables pour tous tiendrait du « miracle ». C'est tout l'enjeu pour l'Europe, entre Washington, Pékin et Moscou.", "link": {"label": "The Economist, 18 novembre 2026", "url": "https://www.economist.com/the-world-ahead/2026/11/18/as-big-powers-tear-down-the-old-order-smaller-ones-will-try-to-band-together", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "Le dernier partage du monde date de 1945.", "question": "On compare le sommet de Shenzhen à la conférence de Yalta. Que s'est-il passé à Yalta ?", "type": "one", "options": ["Les Alliés ont préparé le débarquement de Normandie.", "L'ONU a été fondée.", "L'Allemagne a signé sa capitulation.", "Roosevelt, Churchill et Staline ont dessiné l'Europe d'après-guerre."], "answer": ["D"], "correction": "En février 1945, les 3 vainqueurs de la Seconde Guerre mondiale y ont partagé leurs zones d'influence. Selon Le Figaro, Trump, Xi et Poutine, eux, ne sortent pas d'une guerre et menacent plutôt de nouvelles confrontations.", "link": {"label": "Le Figaro, 17 novembre 2026", "url": "https://www.lefigaro.fr/international/sommet-xi-trump-poutine-a-shenzhen-a-la-table-des-negociations-un-president-americain-affaibli-20261117", "note": "Article réservé aux abonnés."}}, {"hook": "4 pays, 1 club, 0 démocratie.", "question": "Selon The Economist, quels pays coopèrent comme jamais contre l'ordre mondial occidental ?", "type": "multi", "options": ["La Russie.", "La Chine.", "L'Inde.", "L'Iran et la Corée du Nord."], "answer": ["A", "B", "D"], "correction": "The Economist parle d'un nouvel « axe ». La Russie, la Chine, l'Iran et la Corée du Nord coopèrent comme jamais. Leur but : un monde plus sûr pour les régimes autoritaires. L'Inde n'en fait pas partie.", "link": {"label": "The Economist, 19 novembre 2026", "url": "https://www.economist.com/leaders/2026/11/19/deeper-collusion-between-hostile-powers-threatens-the-west", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "Le facteur sonne toujours 2 fois. Surtout s'il vient de Moscou.", "question": "L'émissaire américain Jared Kushner relaie une demande russe de nouvelle « architecture de sécurité » en Europe. Que veut Moscou ?", "type": "one", "options": ["Que l'Ukraine rejoigne l'Union européenne.", "Que l'Otan recule à ses positions d'avant l'élargissement à l'Est.", "Que la Russie rejoigne l'Otan.", "Que les États-Unis quittent l'Asie."], "answer": ["B"], "correction": "Moscou réclame le recul de l'Otan aux positions d'avant son élargissement aux anciens pays de l'Est. C'était déjà son exigence avant l'invasion de l'Ukraine en 2022. En la relayant, Washington la rend crédible.", "link": {"label": "Le Nouvel Obs, 16 novembre 2026", "url": "https://www.nouvelobs.com/le-grand-desordre-mondial/20261116.OBS120177/comment-l-administration-trump-se-fait-petit-telegraphiste-de-poutine.html", "note": "Chronique de Pierre Haski. Article réservé aux abonnés."}}, {"hook": "Destination Kigali, aller simple.", "question": "L'Allemagne, l'Autriche, le Danemark, la Grèce et les Pays-Bas viennent de signer un accord avec le Rwanda. Pour quoi faire ?", "type": "one", "options": ["Y envoyer dès 2027 les migrants dont la demande d'asile a été refusée.", "Y former des soldats pour l'Afrique de l'Est.", "Y acheter des minerais pour les batteries.", "Y ouvrir des écoles européennes."], "answer": ["A"], "correction": "Ils veulent y créer dès 2027 un « hub de retour » pour les déboutés de l'asile. Le Royaume-Uni avait tenté la même chose avant d'abandonner. Un règlement européen adopté en octobre l'autorise désormais.", "link": {"label": "Le Nouvel Obs, 17 novembre 2026", "url": "https://www.nouvelobs.com/monde/20261117.OBS120208/expulsion-de-migrants-au-rwanda-la-ligne-rouge-que-cinq-pays-europeens-viennent-de-franchir.html", "note": "Article réservé aux abonnés."}}, {"hook": "Un sommet, 3 présidents, 1 seul gagnant.", "question": "Que retenir du sommet de Shenzhen entre Xi Jinping, Donald Trump et Vladimir Poutine, selon le spécialiste de la Chine Pierre-Antoine Donnet ?", "type": "one", "options": ["Un accord de paix pour l'Ukraine a été signé.", "L'Europe a obtenu une place à la table.", "La rivalité entre la Chine et les États-Unis est terminée.", "Un triomphe pour Xi Jinping, « l'empereur rouge »."], "answer": ["D"], "correction": "Pour lui, la rencontre n'avait rien d'historique et n'a pas produit grand-chose. Mais elle a consacré Xi Jinping. Le Figaro y voyait déjà la perte de vitesse d'un président américain affaibli.", "link": {"label": "Le Nouvel Obs, 21 novembre 2026", "url": "https://www.nouvelobs.com/monde/20261120.OBS120309/sommet-trump-xi-poutine-a-shenzhen-nous-avons-assiste-au-triomphe-de-l-empereur-rouge.html", "note": "Entretien. Article réservé aux abonnés."}, "added": "2026-11-23"}, {"hook": "29 ans, et déjà au Capitole.", "question": "Melat Kiros, élue démocrate du Colorado aux midterms, entre au Congrès américain. Qu'a-t-elle de nouveau ?", "type": "one", "options": ["Elle est la plus jeune élue de l'histoire du Congrès.", "Elle est la première femme de la génération Z au Congrès.", "Elle est la première socialiste élue au Congrès.", "Elle a battu Alexandria Ocasio-Cortez."], "answer": ["B"], "correction": "Née en Éthiopie, ancienne avocate, démocrate et socialiste, elle a 29 ans. Elle incarne une nouvelle génération d'élus démocrates, qui renouvellent la forme et le fond de leurs messages.", "link": {"label": "Le Monde, 22 novembre 2026", "url": "https://www.lemonde.fr/international/article/2026/11/22/aux-etats-unis-melat-kiros-29-ans-democrate-socialiste-et-premiere-femme-de-la-generation-z-a-entrer-au-congres_6814225_3210.html", "note": "Article réservé aux abonnés."}, "added": "2026-11-23"}]}, {"id": "iran", "title": "Guerre en Iran : pourquoi elle nous coûte cher", "tag": "Iran", "name": "Guerre en Iran", "pitch": "Un conflit lointain, des factures proches.", "color": "menthe", "serious": false, "added": "2026-11-18", "questions": [{"hook": "Une guerre qui dure depuis plus longtemps qu'on ne le croit.", "question": "Quand la guerre des États-Unis et d'Israël contre l'Iran a-t-elle commencé ?", "type": "one", "options": ["En février 2026.", "En octobre 2023.", "En janvier 2020.", "En août 2025."], "answer": ["A"], "correction": "Les frappes ont commencé le 28 février 2026. Le Guide suprême Ali Khamenei a été tué dès le début, et son fils Mojtaba lui a succédé. Plus de 8 mois après, le conflit continue.", "link": {"label": "L'Heure du Monde, 12 novembre 2026", "url": "https://podcasts.lemonde.fr/lheure-du-monde/202611120300-guerre-en-iran-la-population-bout-de-souffle", "note": "« Guerre en Iran : la population à bout de souffle ». Gratuit."}}, {"hook": "Un bras de mer de quelques dizaines de kilomètres, et le monde retient son souffle.", "question": "Pourquoi le détroit d'Ormuz pèse-t-il autant sur nos factures ?", "type": "one", "options": ["Une grande partie du pétrole et du gaz du monde y passe.", "L'Iran y stocke la moitié du pétrole mondial.", "C'est le passage obligé du gaz russe vers l'Europe.", "Il relie la mer Rouge à la Méditerranée."], "answer": ["A"], "correction": "Ce passage entre l'Iran et la péninsule arabique voit transiter environ un cinquième du gaz naturel liquéfié mondial, et beaucoup de pétrole. Depuis mars, le trafic y est perturbé. Moins de bateaux, ce sont des prix qui montent.", "link": {"label": "Le Journal de l'éco, France Culture, 16 novembre 2026", "url": "https://www.radiofrance.fr/franceculture/podcasts/le-journal-de-l-eco/la-crise-d-ormuz-a-t-elle-relance-l-exploration-petroliere-a-travers-le-monde-2712121", "note": "« La crise d'Ormuz a-t-elle relancé l'exploration pétrolière ? ». Gratuit."}}, {"hook": "La facture de gaz a pris l'avion pour le Golfe.", "question": "En septembre, le prix du gaz en Europe a dépassé le double de son niveau d'avant la guerre.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Il a atteint 81 euros le mégawattheure, un record depuis 2023. Le pétrole a flambé d'abord, le gaz a suivi, et l'électricité peut suivre à son tour. L'Allemagne vient de baisser ses taxes sur l'électricité.", "link": {"label": "Le Journal de l'éco, France Culture, 18 septembre 2026", "url": "https://www.radiofrance.fr/franceculture/podcasts/le-journal-de-l-eco/ormuz-une-onde-de-choc-mondiale-sur-les-marches-de-l-energie-2532544", "note": "« Ormuz, une onde de choc mondiale ». Gratuit."}}, {"hook": "Pendant que les missiles volent, les prix aussi.", "question": "Comment vivent les Iraniens après plus de 8 mois de guerre ?", "type": "one", "options": ["Dans une crise économique très grave, sous un pouvoir encore plus militaire.", "Dans une économie de guerre, mais avec une inflation maîtrisée.", "Sous un régime affaibli qui a libéré les prisonniers politiques.", "Dans une crise grave, mais sous un pouvoir civil renforcé."], "answer": ["A"], "correction": "Inflation record, centaines de milliers d'emplois détruits, nouvelles sanctions américaines. Loin d'ouvrir une brèche démocratique, la guerre a renforcé les Gardiens de la révolution, qui tiennent désormais l'État.", "link": {"label": "L'Heure du Monde, 12 novembre 2026", "url": "https://podcasts.lemonde.fr/lheure-du-monde/202611120300-guerre-en-iran-la-population-bout-de-souffle", "note": "Gratuit."}}, {"hook": "Frapper l'Amérique sans aller en Amérique.", "question": "Cette semaine, l'Iran a riposté contre le Koweït et Bahreïn après une frappe américaine. Pourquoi vise-t-il ces pays du Golfe ?", "type": "one", "options": ["Ils accueillent des bases militaires américaines.", "Ils ont déclaré la guerre à l'Iran.", "Ils financent les houthistes du Yémen.", "Ils hébergent l'opposition iranienne en exil."], "answer": ["A"], "correction": "Depuis le début de la guerre, l'Iran frappe les pays qui hébergent des bases américaines : Qatar, Koweït, Arabie saoudite, Émirats. Toute la région devient une cible, et avec elle les routes du pétrole.", "link": {"label": "France 24, 18 novembre 2026", "url": "https://www.france24.com/fr/vid%C3%A9o/20261118-%C3%A9tats-unis-iran-attaque-contre-un-navire-dans-le-d%C3%A9troit-d-ormuz", "note": "« États-Unis, Iran : attaque contre un navire dans le détroit d'Ormuz ». Gratuit."}}, {"hook": "Quand le pétrole manque, on en cherche. Même en pleine COP.", "question": "Depuis la crise d'Ormuz, de nombreux pays ont relancé la recherche de nouveaux gisements de pétrole.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Pour moins dépendre du Golfe, beaucoup de pays lancent des campagnes de prospection. Paradoxe : au même moment, la COP31 discute d'un projet d'accord pour sortir des énergies fossiles.", "link": {"label": "Le Journal de l'éco, France Culture, 16 novembre 2026", "url": "https://www.radiofrance.fr/franceculture/podcasts/le-journal-de-l-eco/la-crise-d-ormuz-a-t-elle-relance-l-exploration-petroliere-a-travers-le-monde-2712121", "note": "Gratuit."}}, {"hook": "Ormuz a un petit frère. Il s'appelle Bab al-Mandab.", "question": "Au Yémen, les houthistes, soutenus par l'Iran, ont pris cet été un autre passage maritime clé. Lequel ?", "type": "one", "options": ["Le détroit d'Ormuz.", "Le canal de Suez.", "Le détroit de Bab al-Mandab.", "Le détroit de Malacca."], "answer": ["C"], "correction": "Il relie la mer Rouge au golfe d'Aden, sur la route du canal de Suez. Les houthistes ne sont plus qu'à 60 km d'Aden, où s'est replié le gouvernement soutenu par l'Arabie saoudite.", "link": {"label": "Le Figaro, 17 novembre 2026", "url": "https://www.lefigaro.fr/international/tout-proches-d-aden-les-houthistes-intensifient-leur-pression-sur-le-gouvernement-pro-saoudien-au-yemen-20261117", "note": "Article réservé aux abonnés."}}, {"hook": "Une crise, et soudain tout le monde aime les éoliennes.", "question": "Selon l'Agence internationale de l'énergie, quelle trace durable la crise d'Ormuz va-t-elle laisser ?", "type": "one", "options": ["Les pays vont diversifier leurs sources d'énergie.", "Le pétrole va rester au-dessus de 200 dollars le baril.", "Les pays vont construire moins de centrales nucléaires.", "Le prix du gaz va revenir à son niveau d'avant-guerre dès 2027."], "answer": ["A"], "correction": "Pour l'AIE, ce « choc immense » pousse les États à diversifier leurs approvisionnements. Son directeur, Fatih Birol, y voit une convergence entre sécurité énergétique et climat.", "link": {"label": "Libération, 19 novembre 2026", "url": "https://www.liberation.fr/economie/energie-le-choc-immense-de-la-crise-dormuz-a-pousse-les-etats-a-diversifier-leurs-sources-dapprovisionnement-20261119_HIR4HFNUVZEDTMJUVZIIKZCNWE/", "note": "Article réservé aux abonnés."}}, {"hook": "Le pouvoir change de main. Pas d'uniforme.", "question": "Selon The Economist, qui prend aujourd'hui les grandes décisions en Iran ?", "type": "one", "options": ["Le président élu, seul.", "Un petit groupe de généraux et de hauts fonctionnaires.", "Le Parlement iranien.", "Le Guide suprême, seul, comme avant la guerre."], "answer": ["B"], "correction": "L'Iran fonctionne sans guide suprême. 6 hommes, issus d'un conseil de généraux et de hauts fonctionnaires, dominent les décisions. Les militaires devraient gagner encore du pouvoir en 2027.", "link": {"label": "The Economist, 15 novembre 2026", "url": "https://www.economist.com/middle-east-and-africa/2026/11/15/iran-is-functioning-without-a-supreme-leader", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "Filmer, c'est déjà résister.", "question": "Le cinéaste iranien Jafar Panahi, palme d'or 2025, vient d'être condamné en Iran. À quoi ?", "type": "one", "options": ["À 1 an d'interdiction de tourner, avec sursis.", "À ne plus parler aux journalistes étrangers.", "À plus de 5 ans de prison et au gel de ses comptes.", "À la déchéance de sa nationalité."], "answer": ["C"], "correction": "Il est rentré en Iran en mars malgré les poursuites. Plus de 400 personnalités du cinéma, dont Martin Scorsese, dénoncent une tentative de l'empêcher de tourner. Il peut faire appel, mais ses comptes sont bloqués.", "link": {"label": "Le Figaro, 19 novembre 2026", "url": "https://www.lefigaro.fr/cinema/martin-scorsese-mark-ruffalo-et-tilda-swinton-s-inquietent-de-la-condamnation-de-jafar-panahi-a-5-ans-de-prison-en-iran-20261119", "note": "Article réservé aux abonnés."}}]}, {"id": "retraites", "title": "Retraites : qui paie pour qui ?", "tag": "Retraites", "name": "Retraites", "pitch": "Le sujet qui ne prend jamais sa retraite.", "color": "rose", "serious": false, "added": "2026-11-18", "questions": [{"hook": "Ta retraite, ce sont tes enfants qui la paieront.", "question": "En France, qui paie les pensions des retraités d'aujourd'hui ?", "type": "one", "options": ["Les personnes qui travaillent aujourd'hui, avec leurs cotisations.", "Chaque retraité, avec l'épargne de toute sa vie.", "Les entreprises, avec leurs bénéfices.", "L'État, uniquement avec les impôts."], "answer": ["A"], "correction": "C'est la répartition : les cotisations des actifs paient les pensions du moment. Le système repose sur la solidarité entre générations. Sa fragilité : avec le vieillissement, il y a de moins en moins d'actifs pour chaque retraité.", "link": {"label": "Le Monde, Les Décodeurs, 18 novembre 2026", "url": "https://www.lemonde.fr/les-decodeurs/article/2026/11/18/faut-il-encore-reformer-les-retraites-les-faits-a-connaitre-pour-comprendre-le-debat_6813070_4355770.html", "note": "« Faut-il encore réformer les retraites ? ». Article réservé aux abonnés."}}, {"hook": "Ton épargne en Bourse, future pension ?", "question": "Marine Le Pen veut ajouter une part de « capitalisation » aux retraites. De quoi s'agit-il ?", "type": "one", "options": ["Chacun épargne pour sa propre retraite, et cet argent est placé.", "L'État augmente les impôts des plus riches.", "Les cotisations des actifs paient les pensions des retraités du moment.", "Les pensions sont versées en une seule fois."], "answer": ["A"], "correction": "Avec la capitalisation, chacun se constitue sa propre épargne retraite, placée sur les marchés. Le RN veut la financer en partie avec de l'argent du logement. Ses opposants y voient un risque pour les précaires, ses soutiens une retraite plus solide.", "link": {"label": "L'édito politique, France Inter, 18 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/l-edito-politique/l-edito-politique-du-mercredi-18-novembre-2026-8657116", "note": "« Le plan retraites de Marine Le Pen, y'a un truc ! ». Gratuit."}}, {"hook": "La réforme Borne fait la sieste.", "question": "Que devient la réforme de 2023, qui repousse l'âge de départ à 64 ans ?", "type": "one", "options": ["Elle est en pause et reprendra début 2028 si aucun texte ne la remplace.", "Elle a été définitivement abrogée.", "Elle s'applique déjà en entier.", "Elle a été remplacée par une retraite à points."], "answer": ["A"], "correction": "La réforme Borne a été mise en pause. Elle reprendra son cours début 2028, sauf si le prochain président la change. D'où l'importance des retraites dans la campagne : chaque candidat promet sa version.", "link": {"label": "Le Nouvel Obs, 17 novembre 2026", "url": "https://www.nouvelobs.com/politique/20261117.OBS120213/capitalisation-durcissement-de-la-validation-des-trimestres-ce-qu-il-faut-retenir-du-projet-de-reforme-des-retraites-de-marine-le-pen.html", "note": "« Ce qu'il faut retenir du projet de réforme des retraites de Marine Le Pen »."}}, {"hook": "Ailleurs, on parle de 70 ans. Respire.", "question": "Quel pays européen prépare un départ à la retraite vers 70 ans pour les moins de 30 ans ?", "type": "one", "options": ["La Norvège.", "L'Italie.", "L'Espagne.", "La Grèce."], "answer": ["A"], "correction": "La Norvège adapte son système au vieillissement : les Norvégiens nés à la fin des années 1990 partiraient vers 70 ans. Partout en Europe, on vit plus longtemps, et la question du financement se pose.", "link": {"label": "Courrier international, 18 novembre 2026", "url": "https://www.courrierinternational.com/", "note": "« Les Norvégiens de moins de 30 ans doivent s'attendre à travailler jusqu'à 70 ans »."}}, {"hook": "Revenir à 62 ans sans dépenser 1 euro ? Il y a un truc.", "question": "Marine Le Pen promet un retour à 62 ans. Que lui reproche le Medef, l'organisation des patrons ?", "type": "one", "options": ["Un financement peu crédible.", "Un projet trop favorable aux entreprises.", "Un âge de départ trop élevé.", "La suppression des régimes spéciaux."], "answer": ["A"], "correction": "Le Medef doute du financement. Le RN promet que ce retour ne coûtera rien, en rendant plus difficile la validation des trimestres. LFI y voit au contraire une « maltraitance sociale ». Le projet est critiqué de tous bords.", "link": {"label": "Libération, 18 novembre 2026", "url": "https://www.liberation.fr/economie/social/le-medef-pas-convaincu-par-le-projet-de-reforme-des-retraites-de-marine-le-pen-20261118_ZSMW73X5SZGKLMNVR7ZTZBTJBA/", "note": "« Le Medef pas convaincu par le projet de Marine Le Pen »."}}, {"hook": "3 boutons pour régler les retraites. Aucun n'est populaire.", "question": "Quels leviers existent pour équilibrer les comptes des retraites ?", "type": "multi", "options": ["Travailler plus longtemps.", "Augmenter les cotisations.", "Baisser le montant des pensions.", "Interdire de travailler après 60 ans."], "answer": ["A", "B", "C"], "correction": "Il existe 3 grands leviers : l'âge de départ, les cotisations et le niveau des pensions. La droite privilégie souvent l'âge, la gauche les cotisations. La capitalisation est un 4e levier, plus rare en France.", "link": {"label": "Le Monde, Les Décodeurs, 18 novembre 2026", "url": "https://www.lemonde.fr/les-decodeurs/article/2026/11/18/faut-il-encore-reformer-les-retraites-les-faits-a-connaitre-pour-comprendre-le-debat_6813070_4355770.html", "note": "Article réservé aux abonnés."}}, {"hook": "La magie, c'est souvent une question de poches.", "question": "Pour financer sa part de capitalisation, où Marine Le Pen veut-elle trouver l'argent ?", "type": "one", "options": ["Dans une nouvelle cotisation des salariés.", "Dans une taxe sur les grandes fortunes.", "Dans un emprunt européen.", "Dans des fonds de l'État, comme le 1 % logement."], "answer": ["D"], "correction": "Elle ne ferait cotiser personne. Elle puiserait dans le fonds de réserve des retraites, le 1 % logement et la formation professionnelle. Pour Patrick Cohen, le plan durcit aussi les règles pour les carrières incomplètes.", "link": {"label": "L'Édito politique, France Inter, 18 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/l-edito-politique/l-edito-politique-du-mercredi-18-novembre-2026-8657116", "note": "Patrick Cohen. Gratuit, 3 min."}}, {"hook": "Miser sa retraite en Bourse, c'est parfois perdre la mise.", "question": "Au Chili, les retraites reposent sur la capitalisation. Que s'est-il passé cette année ?", "type": "one", "options": ["Les pensions ont doublé grâce à la Bourse.", "Les fonds de pension ont perdu 9 milliards d'euros en 9 mois.", "Le pays est revenu à la retraite à 60 ans.", "L'État a interdit les fonds de pension."], "answer": ["B"], "correction": "Des paris financiers risqués ont échoué. 2,3 millions de personnes sont touchées, surtout des retraités et des salariés en fin de carrière. Le ministre leur conseille de travailler 1 ou 2 ans de plus.", "link": {"label": "Le Journal de l'éco, France Culture, 10 novembre 2026", "url": "https://www.radiofrance.fr/franceculture/podcasts/le-journal-de-l-eco/chili-les-fonds-de-pension-perdent-9-milliards-d-euros-les-retraites-trinquent-3310796", "note": "Gratuit, 6 min."}}, {"hook": "Les seniors aussi savent faire des pancartes.", "question": "Jeudi, plus d'un millier de retraités ont manifesté à Paris. Contre quoi ?", "type": "one", "options": ["Le retour à la retraite à 62 ans.", "La fermeture des maisons de retraite publiques.", "Les efforts que le budget 2027 leur demande.", "La hausse du prix des transports en commun."], "answer": ["C"], "correction": "Pour réduire le déficit, le gouvernement veut faire contribuer les retraités d'environ 5,4 milliards d'euros. Les 2 chambres du Parlement ne sont pas d'accord sur cet effort. Les lycéens et étudiants ont rejoint le cortège.", "link": {"label": "Libération, 19 novembre 2026", "url": "https://www.liberation.fr/economie/je-gagne-moins-que-bernard-arnault-en-15-minutes-a-paris-un-cortege-de-retraites-manifeste-contre-les-mesures-budgetaires-les-concernant-20261119_E22F67AGZJCVDOROFJ5ZRYBUJY/", "note": "« Je gagne moins que Bernard Arnault en 15 minutes ». Article réservé aux abonnés."}}, {"hook": "L'Europe, championne du monde de la protection sociale.", "question": "Selon The Economist, quelle part des dépenses sociales du monde l'Europe représente-t-elle ?", "type": "one", "options": ["Environ 1/10.", "Environ 1/4.", "Environ la moitié.", "Presque tout."], "answer": ["C"], "correction": "L'Europe pèse environ la moitié des dépenses sociales mondiales : retraites, santé, chômage. Pour The Economist, elle vit au-dessus de ses moyens. Mais ses divisions politiques rendent les économies très difficiles.", "link": {"label": "The Economist, 10 novembre 2026", "url": "https://www.economist.com/europe/2026/11/10/europe-has-been-living-beyond-its-means-now-the-bills-are-due", "note": "En anglais. Article réservé aux abonnés."}}]}, {"id": "ia", "title": "L'IA nous rend-elle plus bêtes ?", "tag": "IA", "name": "L'IA nous rend-elle bêtes ?", "pitch": "Travail, attention, médias, écrans.", "color": "lilas", "serious": false, "added": "2026-11-18", "questions": [{"hook": "Ton journal parle maintenant à ChatGPT.", "question": "Le Figaro vient de signer un accord avec OpenAI, l'entreprise de ChatGPT. Que va faire ChatGPT ?", "type": "one", "options": ["Proposer des résumés et des extraits du Figaro, avec des liens vers les articles.", "Écrire les articles du Figaro à la place des journalistes.", "Rendre le Figaro gratuit pour tous.", "S'entraîner sur ses articles sans le citer ni le payer."], "answer": ["A"], "correction": "ChatGPT citera le Figaro dans ses réponses, avec un lien vers l'article. C'est le 3e groupe de presse français à signer. Pour les journaux, c'est un revenu et de la visibilité. Le risque : que les lecteurs se contentent du résumé.", "link": {"label": "Le Monde, 18 novembre 2026", "url": "https://www.lemonde.fr/pixels/article/2026/11/18/le-figaro-signe-a-son-tour-un-accord-avec-openai_6813103_4408996.html", "note": "« Le Figaro signe, à son tour, un accord avec OpenAI ». Article réservé aux abonnés."}}, {"hook": "Le débat le plus important de France enfin tranché par une machine.", "question": "Une IA vocale a appelé 6 500 boulangeries du Sud-Ouest. Pour quoi faire ?", "type": "one", "options": ["Savoir si on dit chocolatine ou pain au chocolat.", "Commander 6 500 baguettes.", "Comparer le prix du croissant.", "Recruter des boulangers."], "answer": ["A"], "correction": "Résultat : une frontière de la chocolatine tracée de La Rochelle à Narbonne. Pour les linguistes, la méthode intéresse : l'IA permet des enquêtes à très grande échelle, là où il fallait se fier à l'intuition.", "link": {"label": "Nos vies numériques, France Inter, 11 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/nos-vies-numeriques/nos-vies-numeriques-du-mercredi-11-novembre-2026-2406870", "note": "3 min. Gratuit."}}, {"hook": "Vitesse x1,5 : la vie en accéléré.", "question": "Au Royaume-Uni, 3 moins de 30 ans sur 4 disent accélérer les vidéos et les messages vocaux qu'ils écoutent.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. On accélère pour tout voir et tout écouter. En France, aucune étude ne mesure encore le phénomène. La question de fond : à force de tout consommer vite, retient-on encore quelque chose ?", "link": {"label": "Nos vies numériques, France Inter, 16 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/nos-vies-numeriques/nos-vies-numeriques-du-lundi-16-novembre-2026-2324452", "note": "Gratuit."}}, {"hook": "Même les génies des maths lèvent un sourcil.", "question": "Selon le célèbre mathématicien Terence Tao, quel est le problème de l'intelligence artificielle aujourd'hui ?", "type": "one", "options": ["Elle progresse plus vite que notre compréhension et notre capacité à la sécuriser.", "Elle ne sait pas encore démontrer de théorèmes.", "Elle remplacera les mathématiciens d'ici 2 ans.", "Elle est réservée aux grandes entreprises."], "answer": ["A"], "correction": "Pour Terence Tao, les performances de l'IA dépassent ce que l'on comprend d'elle et notre capacité à la rendre sûre. Il le voit déjà en mathématiques, et y voit un risque bien plus large.", "link": {"label": "The Economist, 18 novembre 2026", "url": "https://www.economist.com/the-world-ahead/2026/11/18/performance-is-outpacing-understanding-and-safety-in-ai-says-terence-tao", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "L'IA a un corps : des entrepôts géants qui chauffent.", "question": "Aux États-Unis, l'opposition aux data centers, ces entrepôts d'ordinateurs qui font tourner l'IA, a pesé dans les élections de mi-mandat.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Ces centres consomment énormément d'électricité et d'eau, et inquiètent les riverains. La France, elle, mise au contraire sur leur construction pour attirer les investissements de l'IA.", "link": {"label": "Le Nouvel Obs, 12 novembre 2026", "url": "https://www.nouvelobs.com/economie/20261112.OBS120071/l-opposition-aux-data-centers-a-pese-lourd-dans-les-midterms-mais-la-france-continue-de-leur-derouler-le-tapis-rouge.html", "note": "« L'opposition aux data centers a pesé lourd dans les midterms »."}}, {"hook": "Scroller tue ? Le débat est lancé.", "question": "À quoi compare-t-on de plus en plus les réseaux sociaux, avec amendes et interdictions à la clé ?", "type": "one", "options": ["Au tabac.", "À la télévision.", "Au sport.", "À la lecture."], "answer": ["A"], "correction": "Comme le tabac, ils seraient addictifs et nocifs pour les jeunes. Des pays interdisent déjà les réseaux aux plus jeunes, et les plateformes paient des amendes. The Economist se demande si la comparaison tient vraiment.", "link": {"label": "The Economist, 18 novembre 2026", "url": "https://www.economist.com/the-world-ahead/2026/11/18/is-social-media-really-the-new-tobacco", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "« Attends, 2 secondes. » Version 2026.", "question": "Comment appelle-t-on le fait d'interrompre un échange avec son enfant pour consulter son téléphone ?", "type": "one", "options": ["Le phubbing parental.", "La technoférence.", "La distraction numérique.", "Le scroll familial."], "answer": ["B"], "correction": "Le mot mêle technologie et interférence. Des études montrent que les bébés s'agitent quand leur mère se tourne vers son téléphone. Le débat sur les écrans vise les enfants, moins les parents.", "link": {"label": "Le Nouvel Obs, 16 novembre 2026", "url": "https://www.nouvelobs.com/opinions/20261116.OBS120191/et-si-c-etaient-les-parents-qui-etaient-trop-connectes-la-technoference-cet-angle-mort-du-debat-sur-les-ecrans.html", "note": "Tribune de Marie Danet, psychologue. Article réservé aux abonnés."}}, {"hook": "Les ados parlent à l'IA. Les parents ne le savent pas toujours.", "question": "Aux États-Unis, près de 2 adolescents sur 3 utilisent déjà l'IA générative, comme ChatGPT.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. 64 % des 13-17 ans l'utilisent aux États-Unis. En Europe, c'est entre 40 et 94 % des 9-16 ans selon les pays. Les parents sous-estiment souvent cet usage.", "link": {"label": "Un monde nouveau, France Inter, 10 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/un-monde-nouveau/un-monde-nouveau-du-mardi-10-novembre-2026-1123579", "note": "Mathilde Serrell. Gratuit, 3 min."}}, {"hook": "La vie en noir et blanc, c'est moins tentant.", "question": "Pour moins scroller, quelle astuce un lycéen de Courbevoie a-t-il adoptée ?", "type": "one", "options": ["Il a mis l'écran de son téléphone en noir et blanc.", "Il a vendu son téléphone.", "Il ne recharge son téléphone qu'une fois par semaine.", "Il a demandé à son algorithme de le bloquer."], "answer": ["A"], "correction": "Sans couleurs, les applications attirent moins. Il a aussi une appli qui limite son temps d'écran, et c'est son père qui a le code. D'autres jeunes coupent les notifications ou bloquent des comptes.", "link": {"label": "Le Grand reportage, France Inter, 16 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/le-grand-reportage-de-france-inter/le-grand-reportage-du-lundi-16-novembre-2026-8843024", "note": "Gratuit, 4 min."}}, {"hook": "Toutes les bulles finissent par faire pschitt.", "question": "Selon The Economist, faut-il s'attendre à un krach de l'IA ?", "type": "one", "options": ["Non, l'IA rapporte déjà plus qu'elle ne coûte.", "Oui, et il ruinera l'économie mondiale.", "Oui, mais pas forcément une catastrophe financière.", "Non, car l'IA est financée par les États."], "answer": ["C"], "correction": "The Economist prédit un krach de l'IA, mais pas forcément un cataclysme financier. Wall Street se demande si l'IA pourra rapporter assez pour rembourser les sommes investies.", "link": {"label": "The Economist, 12 novembre 2026", "url": "https://www.economist.com/leaders/2026/11/12/why-you-should-expect-an-ai-crash", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "Copier sur son voisin, version 2026.", "question": "En Corée du Sud, un scandale de triche avec l'IA a fait tomber un membre du gouvernement. Lequel ?", "type": "one", "options": ["Le ministre de l'Éducation.", "Le ministre des Finances.", "Le Premier ministre.", "Le ministre de la Justice."], "answer": ["A"], "correction": "Un candidat à un concours de la fonction publique avait triché avec l'IA. Juste avant le Suneung, l'examen qui ouvre l'université, le gouvernement a lancé une chasse aux fraudeurs. Le ministre a démissionné.", "link": {"label": "France 24, 22 novembre 2026", "url": "https://www.france24.com/fr/vid%C3%A9o/20261122-cor%C3%A9e-du-sud-d%C3%A9mission-du-ministre-de-l-%C3%A9ducation-apr%C3%A8s-un-scandale-de-triche-%C3%A0-l-ia", "note": "Vidéo. Gratuit."}, "added": "2026-11-23"}]}, {"id": "violences-sexuelles", "title": "Violences sexuelles : ce qui a changé depuis #MeToo", "tag": "Violences sexuelles", "name": "Violences sexuelles", "pitch": "La loi, la justice, les affaires.", "color": "jaune", "serious": true, "added": "2026-11-18", "questions": [{"hook": "2017, le début d'une prise de parole.", "question": "Le mouvement #MeToo est devenu mondial en octobre 2017. Après quelle affaire ?", "type": "one", "options": ["L'affaire Harvey Weinstein.", "L'affaire Jeffrey Epstein.", "L'affaire Dominique Strauss-Kahn.", "L'affaire Roman Polanski."], "answer": ["A"], "correction": "Des enquêtes sur le producteur américain Harvey Weinstein ont libéré la parole de nombreuses femmes. En France, le mouvement a pris le nom de #BalanceTonPorc. Depuis, les plaintes pour violences sexuelles ont fortement augmenté.", "link": {"label": "Le Grand portrait, France Inter, 12 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/le-grand-portrait/le-grand-portrait-du-jeudi-12-novembre-2026-4357770", "note": "Avec Flavie Flament. Gratuit."}}, {"hook": "Un mot est entré dans le Code pénal.", "question": "En France, la définition du viol dans la loi mentionne désormais l'absence de consentement.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Depuis la loi de novembre 2025, tout acte sexuel sans consentement libre et éclairé est une agression ou un viol. Avant, la loi parlait seulement de violence, contrainte, menace ou surprise.", "link": {"label": "Le Grand portrait, France Inter, 12 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/le-grand-portrait/le-grand-portrait-du-jeudi-12-novembre-2026-4357770", "note": "Avec Flavie Flament. Gratuit."}}, {"hook": "Une condamnation qui ne bougera plus.", "question": "Gérard Depardieu a renoncé à son procès en appel. Qu'est-ce que cela change ?", "type": "one", "options": ["Sa condamnation pour agressions sexuelles devient définitive.", "Il est déclaré innocent.", "Il sera rejugé par la Cour de cassation.", "Sa peine est automatiquement effacée."], "answer": ["A"], "correction": "Sa peine de 18 mois de prison avec sursis, prononcée en 2025, devient définitive. Il était jugé pour des agressions sur un tournage en 2021. Il dit assumer cette condamnation et présente ses excuses.", "link": {"label": "Le Nouvel Obs, 13 novembre 2026", "url": "https://www.nouvelobs.com/justice/20261113.OBS120103/depardieu-renonce-a-son-appel-juste-avant-son-proces-pour-agressions-sexuelles.html", "note": "« Depardieu renonce à son appel juste avant son procès »."}}, {"hook": "Accusé ne veut pas dire coupable.", "question": "Quand le parquet demande un procès contre une personnalité, comme Philippe Caubère cette semaine, elle est considérée comme coupable.", "type": "tf", "answer": ["Faux"], "correction": "Faux. Toute personne est présumée innocente jusqu'à son jugement. Le parquet a demandé un procès pour le comédien, accusé par 3 femmes mineures à l'époque. Il conteste les faits. Ce sont les juges qui décideront.", "link": {"label": "Libération, 18 novembre 2026", "url": "https://www.liberation.fr/societe/police-justice/accusations-de-viol-contre-philippe-caubere-le-parquet-demande-un-proces-contre-le-comedien-20261118_BZV4VAF3F5H5LHWONVR7PJY5A4/", "note": "« Le parquet demande un procès contre le comédien »."}}, {"hook": "Le temps ne protège plus les agresseurs d'enfants.", "question": "Pour un viol subi lorsqu'elle était mineure, jusqu'à quand une victime peut-elle porter plainte ?", "type": "one", "options": ["Jusqu'à 30 ans après sa majorité.", "Jusqu'à 10 ans après sa majorité.", "Jusqu'à 20 ans après sa majorité.", "Il n'y a plus aucune limite de temps."], "answer": ["A"], "correction": "Depuis 2018, le délai court 30 ans après la majorité, soit jusqu'à 48 ans. Beaucoup de victimes ne parlent que des années plus tard. La loi tient compte de ce temps nécessaire.", "link": {"label": "Le Grand portrait, France Inter, 12 novembre 2026", "url": "https://www.radiofrance.fr/franceinter/podcasts/le-grand-portrait/le-grand-portrait-du-jeudi-12-novembre-2026-4357770", "note": "Avec Flavie Flament. Gratuit."}}, {"hook": "Ignorer l'âge, une excuse qui pourrait ne plus marcher.", "question": "Que propose un rapport parlementaire publié cette semaine contre la prostitution des mineurs ?", "type": "one", "options": ["Que ce soit au client de prouver qu'il ignorait l'âge, et non l'inverse.", "De sanctionner les mineurs qui se prostituent.", "D'interdire les réseaux sociaux aux mineurs.", "De légaliser les maisons closes."], "answer": ["A"], "correction": "Le rapport propose de « renverser la charge de la preuve » : ce serait au client de prouver qu'il ne savait pas que la victime était mineure. Aujourd'hui, beaucoup échappent aux poursuites en disant l'avoir ignoré.", "link": {"label": "Libération, 18 novembre 2026", "url": "https://www.liberation.fr/societe/droits-des-femmes/prostitution-des-mineurs-un-rapport-parlementaire-appelle-a-renverser-la-charge-de-la-preuve-20261118_ODNC3A6B6RA27A5Y5NSVZ4JIO4/", "note": "« Un rapport parlementaire appelle à renverser la charge de la preuve »."}}, {"hook": "Parler aux enfants, avec leurs mots.", "question": "Pour la première fois, une émission pour enfants de France 4 parle des violences sexuelles. Que leur apprend-elle ?", "type": "multi", "options": ["Ce qu'est le consentement.", "Dire non quand un geste les gêne.", "Garder le secret pour protéger les adultes.", "Repérer les personnes de confiance à qui parler."], "answer": ["A", "B", "D"], "correction": "L'émission « Ton corps est à toi », dans « Okoo-koo », s'adresse aux 6-12 ans. Son animatrice, Manon Théodet, a elle-même subi des violences enfant. Selon les statistiques qu'elle cite, c'est le cas d'un enfant sur 5.", "link": {"label": "Le Nouvel Obs, 17 novembre 2026", "url": "https://www.nouvelobs.com/medias/20261117.OBS120215/pour-la-premiere-fois-une-emission-de-tele-pour-les-enfants-met-en-garde-les-petits-contre-les-violences-sexuelles.html", "note": "Émission disponible en replay sur Okoo. Article réservé aux abonnés."}}, {"hook": "Une enquête menée auprès de 11 200 élèves.", "question": "Selon le ministère de l'Éducation nationale, quelle part des élèves du CE2 au CM2 déclarent avoir subi une violence sexuelle à l'école en 1 an ?", "type": "one", "options": ["Moins de 1 sur 100.", "Environ 1 sur 20.", "Environ 1 sur 3.", "Plus de 9 sur 10."], "answer": ["C"], "correction": "34 % des élèves interrogés le déclarent, filles et garçons à parts proches. Il s'agit surtout de gestes sans accord et de voyeurisme dans les toilettes. Les plus jeunes sont les plus exposés : 42 % en CE2.", "link": {"label": "Le Nouvel Obs, 27 octobre 2026", "url": "https://www.nouvelobs.com/societe/20261027.OBS119579/violences-sexuelles-a-l-ecole-un-tiers-des-eleves-de-ce2-cm1-et-cm2-declarent-en-avoir-subi.html", "note": "Enquête du service statistique de l'Éducation nationale (DEPP). Article réservé aux abonnés."}}, {"hook": "Un mot de justice souvent mal compris.", "question": "Le chorégraphe Bruno Vandelli a été mis en examen pour viol. Qu'est-ce que cela signifie ?", "type": "one", "options": ["Qu'il a été condamné.", "Qu'un juge estime qu'il existe des indices graves contre lui. Il reste présumé innocent.", "Que la plainte a été classée sans suite.", "Qu'il a reconnu les faits."], "answer": ["B"], "correction": "Un juge d'instruction mène l'enquête et estime qu'il existe des indices graves ou concordants. Ce n'est pas une condamnation. Bruno Vandelli conteste les faits et reste présumé innocent.", "link": {"label": "Libération, 19 novembre 2026", "url": "https://www.liberation.fr/culture/le-choregraphe-bruno-vandelli-mis-en-examen-pour-viol-agressions-sexuelles-et-corruption-de-mineur-20261119_JK7DB6XEWVCQRMID34G4SWDP7A/", "note": "Article réservé aux abonnés."}}, {"hook": "Quand le droit des biens oublie la victime.", "question": "En France, un concubin violent écarté du logement commun peut réclamer une indemnité à sa victime pour l'occupation de ce logement.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. Quand le couple n'est pas marié et possède le logement à 2, le droit des biens peut jouer en faveur de l'auteur. La protection du droit de la famille s'arrête là.", "link": {"label": "Le Monde, 19 novembre 2026", "url": "https://www.lemonde.fr/argent/article/2026/11/19/indivision-le-concubin-violent-ecarte-du-logement-peut-reclamer-une-indemnite-d-occupation-a-sa-victime_6813237_1657007.html", "note": "Article réservé aux abonnés."}}]}, {"id": "cyber", "title": "Cyberguerre : la guerre que l'on ne voit pas", "tag": "Cyber", "name": "Cyberguerre", "pitch": "Qui attaque, et comment se protéger.", "color": "menthe", "serious": false, "added": "2026-11-18", "questions": [{"hook": "Ton adresse est peut-être déjà en vente.", "question": "Une filiale de La Poste, Maileva, a été piratée. Combien de personnes ont vu leurs coordonnées volées ?", "type": "one", "options": ["22 000.", "220 000.", "2 millions.", "22 millions."], "answer": ["D"], "correction": "22 millions de personnes : noms, prénoms et adresses. Pas de coordonnées bancaires, mais assez pour des arnaques crédibles. C'est l'une des plus grosses fuites jamais connues en France.", "link": {"label": "Le Nouvel Obs, 15 novembre 2026", "url": "https://www.nouvelobs.com/economie/20261115.OBS120145/les-donnees-de-millions-de-personnes-volees-lors-d-une-cyberattaque-contre-une-filiale-du-groupe-la-poste-ce-que-l-on-sait.html", "note": "« Ce que l'on sait »."}}, {"hook": "Le piège le plus efficace a l'air d'un vrai message.", "question": "Avec ton nom et ton adresse, que peut faire un escroc ?", "type": "one", "options": ["T'envoyer un faux message très crédible pour te soutirer tes codes.", "Vider ton compte bancaire directement.", "Ouvrir un crédit à ton nom sans autre document.", "Rien du tout."], "answer": ["A"], "correction": "C'est l'hameçonnage : un faux colis, une fausse facture, un faux conseiller. Le bon réflexe : ne jamais donner ses codes, et rappeler soi-même l'organisme. Le site Cybermalveillance.gouv.fr aide les victimes.", "link": {"label": "Cybermalveillance.gouv.fr", "url": "https://www.cybermalveillance.gouv.fr/", "note": "Le site officiel d'aide aux victimes. Gratuit."}}, {"hook": "Personne n'a vu de bombe. Tout le monde a eu peur.", "question": "Des fausses alertes à la bombe ont visé des écoles en France, en Italie, en Irlande et au Royaume-Uni. Que soupçonne le ministre de l'Intérieur ?", "type": "one", "options": ["Une ingérence étrangère pour déstabiliser l'Europe.", "Une blague d'élèves qui a dégénéré.", "Un test de sécurité raté.", "Une panne informatique."], "answer": ["A"], "correction": "Pour Laurent Nuñez, ces opérations sont « manifestement concertées ». Il évoque la Russie ou d'autres pays qui veulent semer la peur. Aucune bombe, mais des évacuations, et un climat d'inquiétude.", "link": {"label": "Le Nouvel Obs, 13 novembre 2026", "url": "https://www.nouvelobs.com/societe/20261113.OBS120110/fausses-alertes-a-la-bombe-en-france-et-en-europe-ce-que-l-on-sait-et-ce-que-l-on-ignore-sur-leur-origine.html", "note": "« Ce que l'on sait et ce que l'on ignore »."}}, {"hook": "Nommer le coupable, un geste rare.", "question": "Il est rare que la France accuse publiquement un pays précis d'une cyberattaque.", "type": "tf", "answer": ["Vrai"], "correction": "Vrai. En novembre, la France a désigné l'Iran pour le piratage des frigos de centaines de supermarchés. Avant, seuls des pirates russes avaient été nommés ainsi. Nommer un pays, c'est un message diplomatique fort.", "link": {"label": "Le Nouvel Obs, 13 novembre 2026", "url": "https://www.nouvelobs.com/monde/20261113.OBS120092/cyberattaques-de-frigos-faux-sites-ecolos-comment-l-iran-cible-la-france.html", "note": "« Comment l'Iran cible la France »."}}, {"hook": "Ton mot de passe mérite mieux qu'un coffre ouvert.", "question": "La Macif a reçu une amende de 5 millions d'euros de la CNIL. Pourquoi ?", "type": "one", "options": ["Elle conservait des mots de passe de clients sans les protéger.", "Elle a vendu ses fichiers clients.", "Elle a refusé de rembourser des sinistres.", "Elle a envoyé trop de publicités."], "answer": ["A"], "correction": "La CNIL, gendarme des données personnelles, a relevé des mots de passe conservés en clair et des données gardées trop longtemps. Une entreprise doit protéger tes données, sinon elle paie.", "link": {"label": "Le Monde, 18 novembre 2026", "url": "https://www.lemonde.fr/pixels/article/2026/11/18/donnees-personnelles-la-macif-condamnee-par-la-cnil-a-une-amende-de-5-millions-d-euros-pour-des-manquements-a-la-securite_6813157_4408996.html", "note": "Article réservé aux abonnés."}}, {"hook": "Un pays qui pirate pour payer ses factures.", "question": "Quel pays finance une partie de son régime en volant des cryptomonnaies ?", "type": "one", "options": ["La Corée du Nord.", "Le Salvador.", "Cuba.", "Le Venezuela."], "answer": ["A"], "correction": "La Corée du Nord pirate des plateformes de cryptomonnaies à travers le monde. Pour ce pays sous sanctions, c'est une source d'argent majeure. The Economist prévient : toutes les entreprises sont des cibles.", "link": {"label": "The Economist, 18 novembre 2026", "url": "https://www.economist.com/by-invitation/2026/11/18/north-koreas-cyber-antics-should-worry-every-chief-executive", "note": "En anglais. Article réservé aux abonnés."}}, {"hook": "Les pirates ne viennent pas tous du même port.", "question": "Selon le Premier ministre, qui est derrière les cyberattaques qui visent la France ?", "type": "multi", "options": ["Des États étrangers.", "Des cybercriminels qui veulent de l'argent.", "Des militants, pour des raisons symboliques.", "Uniquement des adolescents isolés."], "answer": ["A", "B", "C"], "correction": "Sébastien Lecornu parle d'une menace « grave et inédite ». Elle vient d'États, de criminels et de militants. L'IA multiplie leur force : l'ANSSI prévient que ce sera « bien pire ».", "link": {"label": "Le Figaro, 19 novembre 2026", "url": "https://www.lefigaro.fr/secteur/high // Panneau du bas (verdict), comme une feuille qui remonte.
function closeSheet() { const sh = document.getElementById("sheet"); if (sh) sh.remove(); document.body.style.paddingBottom = ""; }
function openSheet(node) {
  closeSheet();
  node.id = "sheet";
  document.body.appendChild(node);
  requestAnimationFrame(() => { document.body.style.paddingBottom = node.offsetHeight + 16 + "px"; });
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $(`<div class="confetti" aria-hidden="true"></div>`);
  const colors = ["var(--rose)", "var(--jaune)", "var(--lilas)", "var(--menthe)", "#111"];
  for (let k = 0; k < 46; k++) {
    const b = document.createElement("i");
    b.style.left = Math.random() * 100 + "%";
    b.style.background = colors[k % colors.length];
    b.style.animationDelay = Math.random() * 0.25 + "s";
    b.style.animationDuration = 1.1 + Math.random() * 0.9 + "s";
    b.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    b.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    box.appendChild(b);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2400);
}

const keysOf = (c) => (c.type === "tf" ? ["Vrai", "Faux"] : c.options.map((_, k) => LETTERS[k]));
const labelOf = (c, key, k) => (c.type === "tf" ? key : c.options[k]);
const goodTxt = (c) => c.answer.map((key) => labelOf(c, key, keysOf(c).indexOf(key))).join(" ; ");
// Plusieurs bonnes réponses (24/11) : une ligne verte par réponse, au lieu d'une phrase coupée par des points-virgules.
const goodHtml = (c) => (c.answer.length > 1 ? '<ul class="good-list">' + c.answer.map((key) => "<li>" + esc(labelOf(c, key, keysOf(c).indexOf(key))) + "</li>").join("") + "</ul>" : "<b>" + esc(goodTxt(c)) + "</b>");
const goodLine = (c) => `<div class="sheet-good">${c.answer.length > 1 ? "Bonnes réponses" : "Bonne réponse"} : ${goodHtml(c)}</div>`;
const chipOf = (c) => (c.type === "tf" ? "Vrai ou faux ?" : c.answer.length > 1 ? "Il y a " + c.answer.length + " bonnes réponses" : "Il y a 1 bonne réponse");

function answersBox(c, r, small) {
  const keys = keysOf(c);
  const grid = c.type === "tf" || keys.every((key, k) => labelOf(c, key, k).length <= 44);
  const box = $(`<div class="opts${grid ? " grid" : ""}${small ? " small" : ""}"></div>`);
  keys.forEach((key, k) => {
    const b = $(`<button class="ans" type="button"></button>`);
    b.textContent = labelOf(c, key, k);
    b.dataset.key = key;
    if (r) {
      b.disabled = true;
      const picked = r.picks.includes(key), right = c.answer.includes(key);
      if (right) b.classList.add("right"); else if (picked) b.classList.add("wrong"); else b.classList.add("dim");
      if (right && picked) b.classList.add("mine");
    }
    box.appendChild(b);
  });
  return box;
}

function questionView() {
  const c = day.cards[state.i];
  const r = state.results[state.i];
  const el = $(`<section class="q">
    <span class="theme-pill k-${kindOf(c.theme)}">${esc(c.theme)}</span>
    <p class="q-hook">${esc(c.hook)}</p>
    <h2 class="q-text">${esc(c.question)}</h2>
    <span class="q-chip">${chipOf(c)}</span>
  </section>`);
  const box = answersBox(c, r, false);
  el.appendChild(box);
  if (!r) {
    box.querySelectorAll(".ans").forEach((b) => {
      const key = b.dataset.key;
      if (state.picks.includes(key)) b.classList.add("picked");
      b.setAttribute("aria-pressed", state.picks.includes(key) ? "true" : "false");
      b.onclick = () => {
        if (c.type === "multi") {
          state.picks = state.picks.includes(key) ? state.picks.filter((x) => x !== key) : [...state.picks, key];
          b.classList.toggle("picked", state.picks.includes(key));
          b.setAttribute("aria-pressed", state.picks.includes(key) ? "true" : "false");
          if (state.picks.length === c.answer.length) { box.querySelectorAll(".ans").forEach((x) => (x.disabled = true)); setTimeout(validate, 350); }
        } else { state.picks = [key]; validate(); }
      };
    });
  } else {
    setTimeout(() => showVerdict(c, r), 0);
  }
  return el;
}

function showVerdict(c, r) {
  const last = state.i === day.cards.length - 1;
  const sh = $(`<div class="sheet ${r.ok ? "ok" : "ko"}" role="status">
    <p class="sheet-verdict"><span class="sv-ico" aria-hidden="true">${r.ok ? "✓" : "✕"}</span>${r.ok ? "Bien vu !" : "Raté !"}<span class="sv-gain">${r.ok ? "+" + GAIN.toLocaleString("fr-FR").replace(/\u202f/g, "\u00a0") + " aura" : "+0 aura"}</span></p>
    ${!r.ok && c.type !== "tf" ? goodLine(c) : ""}<p class="sheet-text">${esc(c.correction)}</p>
    <a class="sheet-link" href="${esc(c.link.url)}" target="_blank" rel="noopener"><span>Pour aller plus loin</span><b>${esc(c.link.label)}</b><small>${esc(c.link.note)}</small></a>
    <button class="btn" type="button">${last ? "Voir mes résultats" : "Continuer"}</button>
  </div>`);
  sh.querySelector(".btn").onclick = () => {
    if (last) { finishDay(); state.step = "score"; } else { state.i++; state.picks = []; }
